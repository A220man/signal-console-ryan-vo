version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: signal-console-postgres
    environment:
      POSTGRES_DB: signal_console
      POSTGRES_USER: signal_console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U signal_console -d signal_console
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - signal-console-network
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: signal-console-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: dev-file
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    command: start-dev --import-realm
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n'
        >&3; read -r status <&3; [[ "$$status" == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - signal-console-network
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signal-console-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://signal_console:${POSTGRES_PASSWORD:-changeme}@postgres:5432/signal_console
      ENVIRONMENT: production
      FRONTEND_URL: http://127.0.0.1:5173
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: signal-console
      KEYCLOAK_CLIENT_ID: signal-console-frontend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-changeme}
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAMESITE: lax
      DEMO_MODE: 'false'
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - signal-console-network
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signal-console-frontend
    ports:
    - 127.0.0.1:5173:5173
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:5173
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - signal-console-network
volumes:
  postgres_data: null
  keycloak_data: null
networks:
  signal-console-network:
    driver: bridge
